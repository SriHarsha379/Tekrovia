version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tekrovia-postgres
    # ✅ Fix #10 — credentials from env vars, never hardcoded
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tekrovia}
      POSTGRES_USER: ${POSTGRES_USER:-tekrovia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD env var is required}
    ports:
      # ✅ Fix #2 — bind to loopback only; DB not reachable from outside the host
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ✅ Fix #13 — restart automatically on crash
    restart: unless-stopped
    # ✅ Fix #14 — cap memory so a runaway query can't OOM the host
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tekrovia_user} -d ${POSTGRES_DB:-tekrovia}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: tekrovia-redis
    # ✅ Fix #3 — require a password on Redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD env var is required}
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      # ✅ Fix #2 — loopback only
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    # ✅ Fix #13
    restart: unless-stopped
    # ✅ Fix #14
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  redis_data:
